; Signalhound CYD — standalone 2.4 GHz spectrum watcher (Phase 1 skeleton)
;
; Board:   ESP32-2432S028R  (Classic 2.8" CYD, ILI9341 320x240, XPT2046 touch)
; Target:  ESP32-WROOM-32, 4 MB flash, 520 KB RAM, no PSRAM
;
; Phase 1 scope: dual-core proven, nine screens stubbed, synthetic FFT. The
; real ESP-SDR debug-path RX driver lands in Phase 2 (ESP-IDF port). This
; firmware is pure Arduino + TFT_eSPI so the UI iterates fast.
;
; Flash:
;   pio run -t erase && pio run -t upload   # always erase first per project rule

[platformio]
default_envs = cyd28-signalhound

[env:cyd28-signalhound]
platform  = espressif32@7.0.1
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = partitions.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -std=gnu++17
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    ; TFT_eSPI display SPI pins — same CYD 2.8" wiring as cyd-dongle-controller
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -mtext-section-literals

build_unflags = -std=gnu++11

; Attempted librftest.a link to call esp_phy_wifi_tx_tone (true CW) --
; abandoned: that archive depends on 50+ RF-test-framework symbols only
; present in Espressif's dedicated test firmware. Keep the script + .a
; for future ESP-IDF migration experiments; comment the include out so
; Arduino builds stay clean.
;extra_scripts = pre:scripts/link_rftest.py
