; Signalhound CYD — pure ESP-IDF rewrite
;
; Board:   ESP32-2432S028R  (Classic 2.8" CYD, ILI9341 320x240, XPT2046 touch)
; Target:  ESP32-WROOM-32, 4 MB flash, 520 KB RAM, no PSRAM
;
; Branch idf-full-rewrite: pure ESP-IDF 5.5.x via the pioarduino platform
; fork so we have esp_phy_cert_test (real on-air CW tone from the UI).

[platformio]
default_envs = cyd28-signalhound
; Use IDF-standard "main" component layout.
src_dir = main

[env:cyd28-signalhound]
; Stock espressif32 platform + framework = espidf (NO arduino) resolves to
; IDF 5.5.x, which ships esp_phy_cert_test. We confirmed in Phase A that
; this same framework builds cert_test successfully from PlatformIO.
platform  = espressif32@7.0.1
board     = esp32dev
framework = espidf

monitor_speed = 115200
upload_speed  = 115200
board_build.partitions = partitions.csv
