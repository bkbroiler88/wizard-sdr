; Signalhound CYD -- pioarduino track (Arduino 3.x on IDF 5.x)
;
; Build-flag parity with the proven commit 6a95cb6 ("Transmit hub + CW tone
; experiment + runtime serial CLI") which drove this exact panel in landscape
; via TFT_eSPI's ILI9341_2 driver + INVERSION_ON.
;
; Board:   ESP32-2432S028R  (Classic 2.8" CYD, ILI9341 320x240, XPT2046 touch)

[platformio]
default_envs = cyd28-signalhound

[env:cyd28-signalhound]
platform  = espressif32@7.0.1
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = partitions.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -std=gnu++17
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    ; TFT_eSPI display SPI pins -- CYD 2.8" standard HSPI pads
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -mtext-section-literals
    ; Vendored RF-test blobs (esp_phy_wifi_tx_tone etc) from esp-phy-lib
    ; @ IDF v5.5 submodule f6746ce. Live under ./lib/cert_test/.
    -LC:/Users/bkenn/ESP32/signalhound-cyd/lib/cert_test
    -lrftest
    -lbttestmode

build_unflags = -std=gnu++11
