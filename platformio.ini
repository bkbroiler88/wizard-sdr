; Signalhound CYD -- pioarduino track (Arduino 3.x on IDF 5.x)
;
; Build-flag parity with the proven commit 6a95cb6 ("Transmit hub + CW tone
; experiment + runtime serial CLI") which drove this exact panel in landscape
; via TFT_eSPI's ILI9341_2 driver + INVERSION_ON.
;
; Board:   ESP32-2432S028R  (Classic 2.8" CYD, ILI9341 320x240, XPT2046 touch)

[platformio]
default_envs = cyd28-signalhound

[env:cyd28-signalhound]
platform  = espressif32@7.0.1
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = partitions.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -std=gnu++17
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    ; TFT_eSPI display SPI pins -- CYD 2.8" standard HSPI pads
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -mtext-section-literals
    ; Vendored RF-test blobs (esp_phy_wifi_tx_tone etc) from esp-phy-lib
    ; @ IDF v5.5 submodule f6746ce. Live under ./lib/cert_test/.
    -Llib/cert_test
    -lrftest
    -lbttestmode
    ; Linker intercept: catch RFChannelSel (libphy.a:phy.o), which is called
    ; cross-.o from wifiscwout. --wrap only works for cross-.o references; the
    ; set_channel_rfpll_freq call inside chip_v7_set_chan_nomac is same-.o and
    ; can't be intercepted. See src/pll_wrap.cpp.
    -Wl,--wrap=RFChannelSel

build_unflags = -std=gnu++11


; ---------------------------------------------------------------------------
; AWOK Marauder 6.1 2.4" port — same ESP32-WROOM, same 240x320 ILI9341 panel,
; but completely different pinout: LCD + SD + touch all share ONE VSPI bus
; (18/23/19). External SMA antenna connectors mean this board can actually
; reach — primary target for ham-band TX experimentation.
;
; Pin ground truth from memory cyd24-awok-build.md (verified against
; MARAUDER_V6_1 in configs.h): CS=17 DC=16, BL=32, TOUCH_CS=21, SD_CS=14.
; Panel uses PLAIN ILI9341_DRIVER (not _2) and NO INVERSION_ON.
; SPI dropped to 20 MHz for shared-bus stability under WiFi/BLE APB scaling.
[env:awok-signalhound]
platform  = espressif32@7.0.1
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = partitions.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -std=gnu++17
    -D SIGNALHOUND_AWOK=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    ; TFT_eSPI shared-VSPI pins per MARAUDER_V6_1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=17
    -D TFT_DC=16
    -D TFT_RST=5
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_OFF=1
    -D TFT_RGB_ORDER=TFT_BGR
    ; TFT_eSPI's own touch driver on the SAME SPI bus as the display.
    ; SPI clocks match SquachWatch's awok_user_setup.h -- 40 MHz for the
    ; display, 2.5 MHz for touch. The earlier 20 MHz setting (from the
    ; HaleHound AWOK note) blocked TFT_eSPI's touch read entirely.
    -D TOUCH_CS=21
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -mtext-section-literals
    -Llib/cert_test
    -lrftest
    -lbttestmode
    -Wl,--wrap=RFChannelSel

build_unflags = -std=gnu++11
