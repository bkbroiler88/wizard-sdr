<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="640" height="480" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg{fill:#0a0d12}
      .title{font-family:monospace;font-size:14px;fill:#ffb347;letter-spacing:1px}
      .tile{fill:none;stroke:#4dc9d6;stroke-width:1}
      .tile-text{font-family:monospace;font-size:11px;fill:#4dc9d6}
      .tile-glow{fill:none;stroke:#1a4a52;stroke-width:1}
      .sub{font-family:monospace;font-size:7px;fill:#4a5262}
    </style>
  </defs>
  <rect class="bg" width="320" height="240"/>

  <!-- Title with faint glow underline -->
  <text class="title" x="160" y="30" text-anchor="middle">WIZARDS SDR</text>
  <line x1="100" y1="36" x2="220" y2="36" stroke="#8a5f1c" stroke-width="0.5"/>

  <!-- 6 tiles in 3x2 grid -->
  <!-- Row 1 -->
  <g transform="translate(10,52)">
    <rect class="tile-glow" x="-1" y="-1" width="98" height="54" rx="4"/>
    <rect class="tile" x="0" y="0" width="96" height="52" rx="3"/>
    <text class="tile-text" x="48" y="31" text-anchor="middle">Live</text>
  </g>
  <g transform="translate(112,52)">
    <rect class="tile-glow" x="-1" y="-1" width="98" height="54" rx="4"/>
    <rect class="tile" x="0" y="0" width="96" height="52" rx="3"/>
    <text class="tile-text" x="48" y="31" text-anchor="middle">Tune</text>
  </g>
  <g transform="translate(214,52)">
    <rect class="tile-glow" x="-1" y="-1" width="98" height="54" rx="4"/>
    <rect class="tile" x="0" y="0" width="96" height="52" rx="3"/>
    <text class="tile-text" x="48" y="31" text-anchor="middle">Gain</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(10,118)">
    <rect class="tile-glow" x="-1" y="-1" width="98" height="54" rx="4"/>
    <rect class="tile" x="0" y="0" width="96" height="52" rx="3"/>
    <text class="tile-text" x="48" y="31" text-anchor="middle">Trigger</text>
  </g>
  <g transform="translate(112,118)">
    <rect class="tile-glow" x="-1" y="-1" width="98" height="54" rx="4"/>
    <rect class="tile" x="0" y="0" width="96" height="52" rx="3"/>
    <text class="tile-text" x="48" y="31" text-anchor="middle">Transmit</text>
  </g>
  <g transform="translate(214,118)">
    <rect class="tile-glow" x="-1" y="-1" width="98" height="54" rx="4"/>
    <rect class="tile" x="0" y="0" width="96" height="52" rx="3"/>
    <text class="tile-text" x="48" y="31" text-anchor="middle">Settings</text>
  </g>

  <!-- Status footer -->
  <text class="sub" x="160" y="208" text-anchor="middle">AWOK Marauder 6.1 • ch 7 • AGC on • NVS loaded</text>
  <text class="sub" x="160" y="222" text-anchor="middle">ch 1-5 overlap US 13 cm amateur band</text>
</svg>
